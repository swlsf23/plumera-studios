<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap");
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 256px;
      height: 256px;
      overflow: hidden;
      background: #f3efe5;
    }
    .mark {
      width: 256px;
      height: 256px;
      display: grid;
      place-items: center;
      background: #f3efe5;
      color: #173534;
      font-family: Inter, Arial, sans-serif;
      font-size: 190px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.06em;
      transform: translateY(3%);
    }
  </style>
</head>
<body>
  <div class="mark">P</div>
</body>
</html>
