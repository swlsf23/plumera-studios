[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumera-studios"
version = "1.0.0"
description = "Plumera Studios site tooling (content builder, future APIs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1",
  "Markdown>=3.5",
  "beautifulsoup4>=4.12",
  "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.49",
]

[project.scripts]
plumera-build = "tools.content_builder.build:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.setuptools.package-data]
"tools.content_builder" = ["templates/*.html"]
