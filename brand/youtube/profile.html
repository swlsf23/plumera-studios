<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap");

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #f3efe5;
      color: #173534;
      font-family: Inter, Arial, sans-serif;
    }

    .profile {
      width: 1080px;
      height: 1080px;
      background: #f3efe5;
      display: grid;
      place-items: center;
    }

    .mark {
      font-size: 720px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.06em;
      color: #173534;
      /* Optical center: Inter caps sit slightly high in the em box */
      transform: translateY(4%);
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="profile">
    <span class="mark" aria-label="Plumera">P</span>
  </div>
</body>
</html>
